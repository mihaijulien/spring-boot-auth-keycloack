spring.application.name=library-management-api

spring.web.error.include-message=always

spring.datasource.url=jdbc:mysql://localhost:3306/library_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=library_user
spring.datasource.password=library_password

# Hibernate can detect the MySQL dialect from the JDBC connection

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/master_changelog.yaml

cors.allowedOrigin="http://localhost:5173"